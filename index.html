<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Control RGB</title>
  <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
  <style>
    body { font-family: sans-serif; text-align: center; padding: 20px; background: #111; color: #eee; }
    #muestra { width: 120px; height: 120px; border-radius: 50%; margin: 20px auto; background: rgb(255,0,0); border: 2px solid #555; }
    input[type=range] { width: 90%; height: 40px; }
    #estado { font-weight: bold; color: #f55; }
    #boton { font-size: 20px; padding: 14px 40px; margin-top: 15px; border: none; border-radius: 10px; color: #fff; background: #c33; }
  </style>
</head>
<body>
  <h2>Control RGB</h2>
  <p>Estado: <span id="estado">Conectando...</span></p>
  <div id="muestra"></div>
  <input type="range" id="barra" min="0" max="100" value="0">
  <p id="texto">RGB: 255 0 0</p>
  <button id="boton">Apagar</button>

  <script>
    // Debe ser EXACTAMENTE el mismo tema que en la placa
    const TEMA = "cambia_esto_x7k2/rgb";

    const estado = document.getElementById("estado");
    const barra = document.getElementById("barra");
    const muestra = document.getElementById("muestra");
    const texto = document.getElementById("texto");
    const boton = document.getElementById("boton");

    const cliente = mqtt.connect("wss://broker.hivemq.com:8884/mqtt");

    cliente.on("connect", () => { estado.textContent = "Conectado"; estado.style.color = "#5f5"; });
    cliente.on("close", () => { estado.textContent = "Desconectado"; estado.style.color = "#f55"; });

    // Rojo -> verde (zona central corta) -> azul
    function color(p) {
      let r = 0, g = 0, b = 0;
      if (p < 45) { const t = p / 45; r = 255 * (1 - t); g = 255 * t; }
      else if (p <= 55) { g = 255; }
      else { const t = (p - 55) / 45; g = 255 * (1 - t); b = 255 * t; }
      return [Math.round(r), Math.round(g), Math.round(b)];
    }

    let encendido = true;
    let ultimoEnvio = 0;
    let pendiente = null;

    function enviar() {
      const [r, g, b] = color(Number(barra.value));
      if (encendido) {
        muestra.style.background = `rgb(${r},${g},${b})`;
        texto.textContent = `RGB: ${r} ${g} ${b}`;
      } else {
        muestra.style.background = "#000";
        texto.textContent = `Apagado (color elegido: ${r} ${g} ${b})`;
      }
      if (cliente.connected) {
        const mensaje = encendido ? `${r} ${g} ${b}` : "0 0 0";
        cliente.publish(TEMA, mensaje, { retain: true });
      }
      ultimoEnvio = Date.now();
    }

    barra.addEventListener("input", () => {
      clearTimeout(pendiente);
      const espera = 60 - (Date.now() - ultimoEnvio);
      if (espera <= 0) enviar();
      else pendiente = setTimeout(enviar, espera);
    });

    boton.addEventListener("click", () => {
      clearTimeout(pendiente);
      encendido = !encendido;
      boton.textContent = encendido ? "Apagar" : "Encender";
      boton.style.background = encendido ? "#c33" : "#3a3";
      enviar();
    });
  </script>
</body>
</html>
